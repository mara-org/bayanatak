[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bayanatak"
version = "0.1.0"
description = "Saudi-flavored fake test data for local product development."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Mara Labs" }]
keywords = ["test-data", "saudi", "arabic", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
bayanatak = "bayanatak.cli:main"

[project.urls]
Repository = "https://github.com/mara-org/bayanatak"
Issues = "https://github.com/mara-org/bayanatak/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/bayanatak"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
